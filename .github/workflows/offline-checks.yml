name: Offline research checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_materials.py
      - run: python tools/verify_materials.py .
      - run: python -m unittest discover -s OPD2515-OTA-Helper/tests -p 'test_*.py' -v
      - run: node OPD2515-OTA-Helper/tests/test_webui.mjs
